<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121F"/>
      <stop offset="1" stop-color="#231A2E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A97E"/>
      <stop offset="1" stop-color="#C98BB9"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A97E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2A97E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke-dasharray: 6 8; animation: flow 6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -140; } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <circle cx="1010" cy="170" r="210" fill="url(#orb)"/>

  <!-- Signal → Decision → Outcome graphic -->
  <g transform="translate(830,70)">
    <path class="line" d="M20 40 C 90 40, 90 100, 170 100" stroke="#C98BB9" stroke-width="2" fill="none"/>
    <path class="line" d="M20 100 L 170 100" stroke="#C98BB9" stroke-width="2" fill="none"/>
    <path class="line" d="M20 160 C 90 160, 90 100, 170 100" stroke="#C98BB9" stroke-width="2" fill="none"/>
    <path class="line" d="M190 100 L 300 100" stroke="#F2A97E" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="40" r="7" fill="#C98BB9"/>
    <circle cx="20" cy="100" r="7" fill="#C98BB9"/>
    <circle cx="20" cy="160" r="7" fill="#C98BB9"/>
    <g class="pulse"><rect x="160" y="80" width="40" height="40" rx="8" transform="rotate(45 180 100)" fill="url(#glow)"/></g>
    <circle cx="312" cy="100" r="12" fill="none" stroke="#F2A97E" stroke-width="2.5"/>
    <circle cx="312" cy="100" r="5" fill="#F2A97E"/>
    <text x="20" y="205" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">signals</text>
    <text x="180" y="205" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">decision</text>
    <text x="312" y="205" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">outcome</text>
  </g>

  <text x="64" y="92" class="mono" font-size="15" fill="#F2A97E" letter-spacing="2">STRATEGY &amp; TRANSFORMATION LEADER</text>
  <text x="64" y="160" class="sans" font-size="56" font-weight="700" fill="#F7F3EE">Weiwei Hu</text>
  <text x="64" y="212" class="sans" font-size="23" fill="#D9D2E3">Turning AI into <tspan fill="#F2A97E" font-weight="600">better decisions</tspan>, <tspan fill="#F2A97E" font-weight="600">simplified</tspan></text>
  <text x="64" y="244" class="sans" font-size="23" fill="#D9D2E3"><tspan fill="#F2A97E" font-weight="600">workflows</tspan>, and <tspan fill="#F2A97E" font-weight="600">measurable business value</tspan>.</text>
  <rect x="64" y="276" width="74" height="4" rx="2" fill="url(#glow)"/>
  <text x="156" y="283" class="mono" font-size="13" fill="#9C93AE">fluency · knowledge · workflows · measurement</text>
</svg>
