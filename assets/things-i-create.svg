<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A97E"/>
      <stop offset="1" stop-color="#C98BB9"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A97E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2A97E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .spin { animation: spin 50s linear infinite; transform-origin: 280px 320px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="600" rx="22" fill="#17141F"/>
  <text x="56" y="60" class="mono" font-size="14" fill="#F2A97E" letter-spacing="2">THINGS I CREATE · FROM EVERYDAY LIFE</text>

  <circle cx="280" cy="320" r="240" fill="url(#orb)"/>
  <g class="spin"><circle cx="280" cy="320" r="170" fill="none" stroke="#3A3248" stroke-width="2" stroke-dasharray="4 10"/></g>
  <line x1="280" y1="320" x2="280" y2="150" stroke="#3A3248" stroke-width="2" stroke-dasharray="3 7"/><line x1="280" y1="320" x2="442" y2="267" stroke="#3A3248" stroke-width="2" stroke-dasharray="3 7"/><line x1="280" y1="320" x2="380" y2="458" stroke="#3A3248" stroke-width="2" stroke-dasharray="3 7"/><line x1="280" y1="320" x2="180" y2="458" stroke="#3A3248" stroke-width="2" stroke-dasharray="3 7"/><line x1="280" y1="320" x2="118" y2="267" stroke="#3A3248" stroke-width="2" stroke-dasharray="3 7"/>
  <circle cx="280" cy="320" r="62" fill="url(#g)"/>
  <text x="280" y="316" class="sans" font-size="17" font-weight="700" fill="#17141F" text-anchor="middle">AI Hub</text>
  <text x="280" y="336" class="mono" font-size="11" fill="#17141F" text-anchor="middle">one home</text>
  <g class="float" style="animation-delay:0.0s">
    <circle cx="280" cy="150" r="30" fill="#2A2236" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="280" cy="150" r="8" fill="#F2A97E"/>
  </g>
  <text x="280" y="100" class="sans" font-size="15" font-weight="700" fill="#F7F3EE" text-anchor="middle">The Atelier</text>
  <text x="280" y="119" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">plan days</text><g class="float" style="animation-delay:0.6s">
    <circle cx="442" cy="267" r="30" fill="#2A2236" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="442" cy="267" r="8" fill="#F2A97E"/>
  </g>
  <text x="442" y="325" class="sans" font-size="15" font-weight="700" fill="#F7F3EE" text-anchor="middle">Underline AI</text>
  <text x="442" y="344" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">next steps</text><g class="float" style="animation-delay:1.2s">
    <circle cx="380" cy="458" r="30" fill="#2A2236" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="380" cy="458" r="8" fill="#F2A97E"/>
  </g>
  <text x="380" y="516" class="sans" font-size="15" font-weight="700" fill="#F7F3EE" text-anchor="middle">Evera Table</text>
  <text x="380" y="535" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">cook well</text><g class="float" style="animation-delay:1.7999999999999998s">
    <circle cx="180" cy="458" r="30" fill="#2A2236" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="180" cy="458" r="8" fill="#F2A97E"/>
  </g>
  <text x="180" y="516" class="sans" font-size="15" font-weight="700" fill="#F7F3EE" text-anchor="middle">Life Designer</text>
  <text x="180" y="535" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">shape paths</text><g class="float" style="animation-delay:2.4s">
    <circle cx="118" cy="267" r="30" fill="#2A2236" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="118" cy="267" r="8" fill="#F2A97E"/>
  </g>
  <text x="118" y="325" class="sans" font-size="15" font-weight="700" fill="#F7F3EE" text-anchor="middle">Status Board</text>
  <text x="118" y="344" class="mono" font-size="12" fill="#9C93AE" text-anchor="middle">track projects</text>

  <g transform="translate(600,112)">
    <rect width="550" height="118" rx="16" fill="#211C2C" stroke="#3A3248"/>
    <text x="28" y="42" class="mono" font-size="14" fill="#F2A97E">01 · NOTICE</text>
    <text x="28" y="80" class="sans" font-size="24" font-weight="700" fill="#F7F3EE">Start with what I care about</text>
    <text x="28" y="104" class="sans" font-size="15" fill="#B9B0C8">A daily friction, a goal, a meal, a decision</text>
  </g>
  <g transform="translate(600,250)">
    <rect width="550" height="118" rx="16" fill="#211C2C" stroke="#3A3248"/>
    <text x="28" y="42" class="mono" font-size="14" fill="#E39C98">02 · BUILD</text>
    <text x="28" y="80" class="sans" font-size="24" font-weight="700" fill="#F7F3EE">Turn it into a small AI tool</text>
    <text x="28" y="104" class="sans" font-size="15" fill="#B9B0C8">Practical and ready to use in a browser</text>
  </g>
  <g transform="translate(600,388)">
    <rect width="550" height="118" rx="16" fill="#211C2C" stroke="#3A3248"/>
    <text x="28" y="42" class="mono" font-size="14" fill="#C98BB9">03 · SHARE</text>
    <text x="28" y="80" class="sans" font-size="24" font-weight="700" fill="#F7F3EE">Open it up for anyone</text>
    <text x="28" y="104" class="sans" font-size="15" fill="#B9B0C8">Shared here, and improved as I use it myself</text>
  </g>
